<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" fill="none" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Caveat:wght@700&amp;display=swap');
      .logo-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        fill: #26292c;
      }
      .repair-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        fill: #26292c;
        letter-spacing: 9px;
      }
      .my-script {
        font-family: 'Caveat', cursive, sans-serif;
        font-weight: 700;
        font-size: 58px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Left Text: 'book' -->
  <text x="24" y="106" class="logo-text" font-size="82" letter-spacing="-1px">book</text>

  <!-- Red Sofa Icon in Middle -->
  <g transform="translate(196, 22)">
    <!-- Main Sofa Body -->
    <!-- Backrest & Tufting -->
    <path d="M 24 16 C 26 2, 114 2, 116 16 C 124 14, 134 26, 134 40 C 146 44, 154 58, 150 72 C 146 84, 136 88, 126 88 L 126 95 L 118 95 L 120 88 L 20 88 L 22 95 L 14 95 L 14 88 C 4 88, -6 84, -10 72 C -14 58, -6 44, 6 40 C 6 26, 16 14, 24 16 Z" fill="#e3274b" />
    
    <!-- Armrest Curves & Cushion Inset Lines -->
    <path d="M 12 44 C 6 48, 4 60, 8 72 C 11 80, 18 84, 25 84" stroke="#bf1737" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 128 44 C 134 48, 136 60, 132 72 C 129 80, 122 84, 115 84" stroke="#bf1737" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 22 64 C 50 67, 90 67, 118 64" stroke="#bf1737" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Sofa Legs -->
    <path d="M 17 88 L 15 97 L 23 97 L 21 88 Z" fill="#b01331" />
    <path d="M 119 88 L 117 97 L 125 97 L 123 88 Z" fill="#b01331" />

    <!-- Script Text 'My' inside sofa -->
    <!-- Precise brush-stroke paths for dynamic authentic 'My' -->
    <g transform="translate(20, 8) rotate(-10)">
      <!-- 'M' stroke -->
      <path d="M 22 46 C 26 32, 34 20, 42 16 C 46 14, 48 18, 43 28 C 39 36, 33 46, 30 52 C 28 55, 33 52, 38 43 C 44 32, 51 22, 57 23 C 60 24, 61 28, 58 35 C 54 44, 49 53, 47 57 C 51 53, 60 37, 69 34 C 74 32, 77 36, 73 45 C 69 55, 63 60, 60 62" 
            stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- 'y' stroke with flourish loop -->
      <path d="M 68 40 C 73 48, 77 56, 81 56 C 85 56, 89 48, 93 36 M 92 37 C 88 47, 82 58, 77 69 C 72 79, 63 88, 54 84 C 47 80, 52 70, 62 67 C 72 64, 82 55, 87 46" 
            stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Right Text: 'sofa' -->
  <text x="360" y="106" class="logo-text" font-size="82" letter-spacing="-1px">sofa</text>

  <!-- Red Accent Divider Line -->
  <line x1="24" y1="126" x2="335" y2="126" stroke="#e3274b" stroke-width="5" stroke-linecap="round" />

  <!-- Subtitle: 'REPAIR' on bottom right -->
  <text x="364" y="168" class="repair-text" font-size="38">REPAIR</text>
</svg>
